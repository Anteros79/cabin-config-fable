[project]
name = "cabin-kit"
version = "0.1.0"
description = "Fictional cabin configuration and appearance check lab"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.5", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "playwright==1.65.1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
