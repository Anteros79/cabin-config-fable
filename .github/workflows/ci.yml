name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # biome ci checks lint and formatting, unlike `biome lint`.
      - run: npx biome ci .
      - run: npm run typecheck
      # Build first so the build outputs exist; the bundle test builds its own copies in a temp directory.
      - run: npm run build
      - run: npm run build:e2e
      - run: npm run coverage
      - run: npm audit --omit=dev --audit-level=high
      # Clean-clone import: reads fixtures/originals, never the ../../ originals.
      - name: Import reference data
        run: node src/importer/cli.ts import
        env:
          CABIN_KIT_DATA_DIR: ${{ runner.temp }}/ck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov-${{ matrix.os }}
          path: coverage/lcov.info
          if-no-files-found: ignore
