name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # biome ci checks lint and formatting, unlike `biome lint`.
      - run: npx biome ci .
      - run: npm run typecheck
      # Build first so the build outputs exist; the bundle test builds its own copies in a temp directory.
      - run: npm run build
      # bundle budgets (budgets.json): fails the job when a chunk outgrows its gzip budget (Task 6.5)
      - run: node tools/check-budgets.ts
      - run: npm run build:e2e
      - run: npm run coverage
      - run: npm audit --omit=dev --audit-level=high
      # Clean-clone import: reads fixtures/originals, never the ../../ originals.
      - name: Import reference data
        run: node src/importer/cli.ts import
        env:
          CABIN_KIT_DATA_DIR: ${{ runner.temp }}/ck
      # Builds and tests write only ignored or temporary files (TST-05); evidence is captured on purpose, not here.
      - name: The run left the tree unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov-${{ matrix.os }}
          path: coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    name: e2e (Playwright, Linux, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the bundled Chromium and its system libraries; WebGL runs on SwiftShader (playwright.config.ts)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: The run left the tree unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
